services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_USER: bs
      MYSQL_PASSWORD: better-password
      MYSQL_DATABASE: bs_php_app

  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_USER: bs
      MYSQL_PASSWORD: better-password
      MYSQL_DATABASE: bs_php_app
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
